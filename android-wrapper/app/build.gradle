plugins {
    id 'com.android.application'
}

android {
    namespace 'com.karlolegend.zrakoperka'
    compileSdk 35

    defaultConfig {
        applicationId 'com.karlolegend.zrakoperka'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '0.16.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
