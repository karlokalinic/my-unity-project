name: Trigger Unity Build Automation API

on:
  workflow_run:
    workflows: ["Sync Unity Build Automation mirror"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unitylaptop-uba-api-trigger
  cancel-in-progress: false

jobs:
  trigger-build:
    name: Create real Unity Build Automation build
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UNITY_API_KEY: ${{ secrets.UNITY_BUILD_AUTOMATION_API_KEY || secrets.UNITY_CLOUD_BUILD_API_KEY || secrets.UNITY_API_KEY }}
      UNITY_ORG_ID: "6872486406979"
      UNITY_PROJECT_ID: "c5f8ee3c-ba65-4e4a-8174-2fc09f6e9b52"
      UNITY_TARGET_NAME: "UNITYLAPTOP-WebGL-DEV"
      UNITY_TARGET_BRANCH: "tooling/unity-cloud-devops"
      UNITY_API_ROOT: "https://build-api.cloud.unity3d.com/api/v1"
    steps:
      - name: Require protected Unity API key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UNITY_API_KEY}" ]]; then
            echo '::error::No Unity Build Automation API key is available to GitHub Actions.'
            echo '::error::Expected one of these protected repository secrets: UNITY_BUILD_AUTOMATION_API_KEY, UNITY_CLOUD_BUILD_API_KEY, UNITY_API_KEY.'
            exit 1
          fi
          echo 'Unity Build Automation API credential is available as a protected Actions secret.'

      - name: Resolve configured Unity build target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${UNITY_API_ROOT}/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets"
          http_code="$(curl --silent --show-error \
            --output targets.json \
            --write-out '%{http_code}' \
            --header "Authorization: Basic ${UNITY_API_KEY}" \
            --header 'Accept: application/json' \
            "${endpoint}")"
          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "::error::Unity build-target lookup failed with HTTP ${http_code}."
            cat targets.json || true
            exit 1
          fi

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re

          data = json.load(open('targets.json', encoding='utf-8'))
          wanted_name = os.environ['UNITY_TARGET_NAME']
          wanted_branch = os.environ['UNITY_TARGET_BRANCH']

          objects = []
          def walk(value):
              if isinstance(value, dict):
                  objects.append(value)
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)

          def strings(obj):
              return {str(v) for v in obj.values() if isinstance(v, (str, int, float, bool))}

          candidates = []
          for obj in objects:
              vals = strings(obj)
              score = 0
              if wanted_name in vals:
                  score += 10
              if wanted_branch in vals:
                  score += 5
              text = json.dumps(obj, separators=(',', ':'))
              if wanted_name in text:
                  score += 3
              if wanted_branch in text:
                  score += 2
              if score:
                  candidates.append((score, obj))

          if not candidates:
              raise SystemExit(f'Unable to resolve Unity build target {wanted_name!r} / branch {wanted_branch!r}.')

          candidates.sort(key=lambda item: item[0], reverse=True)
          obj = candidates[0][1]
          target_id = None
          for key in ('buildtargetid', 'buildTargetId', 'buildTargetID', 'id', '_id'):
              value = obj.get(key)
              if isinstance(value, (str, int)) and str(value):
                  target_id = str(value)
                  break

          if not target_id:
              text = json.dumps(obj, separators=(',', ':'))
              match = re.search(r'/buildtargets/([^/"?]+)', text)
              if match:
                  target_id = match.group(1)

          if not target_id:
              raise SystemExit('Matched Unity build target but could not extract its buildtargetid.')

          print(f'target_id={target_id}')
          print(f'Resolved Unity build target id: {target_id}', file=__import__('sys').stderr)
          PY

      - name: Resolve exact mirror revision
        id: mirror
        shell: bash
        run: |
          set -euo pipefail
          mirror_sha="$(git ls-remote https://github.com/karlokalinic/my-unity-project.git "refs/heads/${UNITY_TARGET_BRANCH}" | awk 'NR == 1 { print $1}')"
          test -n "${mirror_sha}"
          echo "sha=${mirror_sha}" >> "$GITHUB_OUTPUT"
          echo "Exact Unity mirror revision: ${mirror_sha}"

      - name: Trigger real Unity build via REST API
        id: build
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.target_id }}
          MIRROR_SHA: ${{ steps.mirror.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > request.json
          import json
          import os
          print(json.dumps({
              'clean': False,
              'delay': 0,
              'commit': os.environ['MIRROR_SHA'],
          }, separators=(',', ':')))
          PY

          endpoint="${UNITY_API_ROOT}/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/${TARGET_ID}/builds"
          http_code="$(curl --silent --show-error \
            --output build-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Basic ${UNITY_API_KEY}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --data @request.json \
            "${endpoint}")"

          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "::error::Unity create-build API failed with HTTP ${http_code}."
            cat build-response.json || true
            exit 1
          fi

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          data = json.load(open('build-response.json', encoding='utf-8'))
          first = data[0] if isinstance(data, list) and data else data
          if not isinstance(first, dict):
              raise SystemExit('Unity create-build response did not contain a build object.')
          number = None
          for key in ('build', 'buildNumber', 'number'):
              value = first.get(key)
              if value is not None:
                  number = str(value)
                  break
          if not number:
              raise SystemExit('Unity accepted create-build request but no build number was returned.')
          print(f'number={number}')
          print(f'UNITY_BUILD_CREATED number={number}', file=sys.stderr)
          PY

      - name: Verify new Unity build exists
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.target_id }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          MIRROR_SHA: ${{ steps.mirror.outputs.sha }}
        run: |
          set -euo pipefail
          endpoint="${UNITY_API_ROOT}/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/${TARGET_ID}/builds/${BUILD_NUMBER}"
          http_code="$(curl --silent --show-error \
            --output build-status.json \
            --write-out '%{http_code}' \
            --header "Authorization: Basic ${UNITY_API_KEY}" \
            --header 'Accept: application/json' \
            "${endpoint}")"
          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "::error::Unity build ${BUILD_NUMBER} was not readable after creation (HTTP ${http_code})."
            cat build-status.json || true
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          data = json.load(open('build-status.json', encoding='utf-8'))
          status = data.get('buildStatus') or data.get('status') or 'unknown'
          commit = data.get('commit') or data.get('scmRevision') or data.get('revision') or 'unknown'
          print(f"UNITY_BUILD_CONFIRMED number={os.environ['BUILD_NUMBER']} status={status} apiCommit={commit} requestedCommit={os.environ['MIRROR_SHA']}")
          PY
