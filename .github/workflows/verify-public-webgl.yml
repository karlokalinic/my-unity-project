name: Verify public Unity WebGL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unitylaptop-public-webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public:
    name: Verify exact canonical Unity revision is public
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_URL: https://unitylaptop.karlolegend.workers.dev
    steps:
      - name: Wait for exact canonical revision
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          echo "Expected canonical revision: ${expected}"

          for attempt in $(seq 1 90); do
            marker="$(curl --fail --silent --show-error --location --max-time 20 "${PUBLIC_URL}/unitylaptop-build.json?probe=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            index="$(curl --fail --silent --show-error --location --max-time 20 "${PUBLIC_URL}/?probe=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"

            if [[ ${attempt} -eq 1 ]]; then
              printf 'Initial marker: %s\n' "${marker:0:2000}"
              if [[ "$index" == *'createUnityInstance'* ]] || [[ "$index" == *'.loader.js'* ]]; then
                echo 'Initial entry point: Unity loader detected.'
              elif [[ "$index" == *'app.js?v=20260905-physics1'* ]]; then
                echo 'Initial entry point: legacy browser fallback detected.'
              elif [[ -z "$index" ]]; then
                echo 'Initial entry point: unreachable or empty response.'
              else
                echo 'Initial entry point: reachable, but not recognized as Unity WebGL.'
              fi
            fi

            if [[ "$marker" == *'"sourceRepository":"karlokalinic/my-unity-project"'* ]] && \
               [[ "$marker" == *"\"sourceRevision\":\"${expected}\""* ]] && \
               [[ "$index" != *'app.js?v=20260905-physics1'* ]] && \
               { [[ "$index" == *'createUnityInstance'* ]] || [[ "$index" == *'.loader.js'* ]]; }; then
              echo "PUBLIC_WEBGL_VERIFIED revision=${expected} url=${PUBLIC_URL}"
              exit 0
            fi

            echo "Exact public revision not live (${attempt}/90); waiting 10s..."
            sleep 10
          done

          echo '::error::PUBLIC_WEBGL_NOT_VERIFIED'
          echo "::error::Expected canonical revision ${expected} was not served by ${PUBLIC_URL}."
          exit 1
