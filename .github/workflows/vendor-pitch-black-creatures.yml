      - name: Reconstruct and verify authorized archive
        shell: python
        run: |
          import pathlib, struct, zlib, hashlib, zipfile, shutil

          EXPECTED_ARCHIVE_SHA = 'a0f4f7f30214208f22afa1703b351d6494489daacd0769ed20f45d9ee5b3ade7'
          EXPECTED_PARTS = 27
          W, H = 200, 148
          rowbytes = W * 4

          def decode_png(path):
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise RuntimeError(f'{path.name}: invalid PNG signature')
              pos, width, height, bit_depth, color_type = 8, None, None, None, None
              idat = bytearray()
              while pos < len(data):
                  length = struct.unpack('>I', data[pos:pos+4])[0]
                  kind = data[pos+4:pos+8]
                  chunk = data[pos+8:pos+8+length]
                  pos += 12 + length
                  if kind == b'IHDR':
                      width, height, bit_depth, color_type, compression, filtering, interlace = struct.unpack('>IIBBBBB', chunk)
                      if (width, height, bit_depth, color_type, compression, filtering, interlace) != (W, H, 8, 6, 0, 0, 0):
                          raise RuntimeError(f'{path.name}: unexpected PNG format {(width, height, bit_depth, color_type, compression, filtering, interlace)}')
                  elif kind == b'IDAT':
                      idat.extend(chunk)
                  elif kind == b'IEND':
                      break

              raw = zlib.decompress(bytes(idat))
              bpp = 4
              rows = []
              prev = bytearray(rowbytes)
              offset = 0
              for _ in range(H):
                  filter_type = raw[offset]
                  scan = bytearray(raw[offset+1:offset+1+rowbytes])
                  offset += 1 + rowbytes
                  recon = bytearray(rowbytes)
                  for x in range(rowbytes):
                      a = recon[x-bpp] if x >= bpp else 0
                      b = prev[x]
                      c = prev[x-bpp] if x >= bpp else 0
                      val = scan[x]
                      if filter_type == 0:
                          pred = 0
                      elif filter_type == 1:
                          pred = a
                      elif filter_type == 2:
                          pred = b
                      elif filter_type == 3:
                          pred = (a + b) // 2
                      elif filter_type == 4:
                          p = a + b - c
                          pa, pb, pc = abs(p-a), abs(p-b), abs(p-c)
                          pred = a if pa <= pb and pa <= pc else (b if pb <= pc else c)
                      else:
                          raise RuntimeError(f'{path.name}: unsupported PNG filter {filter_type}')
                      recon[x] = (val + pred) & 0xff
                  rows.append(bytes(recon))
                  prev = recon
              return b''.join(rows)

          pieces = [None] * EXPECTED_PARTS
          for path in sorted(pathlib.Path('/tmp/carriers').glob('carrier_*.png')):
              pixels = decode_png(path)
              if pixels[:4] != b'ULPC':
                  raise RuntimeError(f'{path.name}: carrier magic corrupted')
              index, count, length = struct.unpack('>HHI', pixels[4:12])
              expected_sha = pixels[12:44]
              segment = pixels[44:44+length]
              if count != EXPECTED_PARTS or index >= count:
                  raise RuntimeError(f'{path.name}: invalid carrier index/count {index}/{count}')
              actual_sha = hashlib.sha256(segment).digest()
              if actual_sha != expected_sha:
                  raise RuntimeError(f'{path.name}: carrier payload SHA-256 mismatch')
              if pieces[index] is not None:
                  raise RuntimeError(f'duplicate carrier segment {index}')
              pieces[index] = segment

          if any(piece is None for piece in pieces):
              raise RuntimeError('one or more carrier segments are missing')

          archive_bytes = b''.join(pieces)
          actual_archive_sha = hashlib.sha256(archive_bytes).hexdigest()
          if actual_archive_sha != EXPECTED_ARCHIVE_SHA:
              raise RuntimeError(f'archive SHA mismatch: {actual_archive_sha}')

          archive_path = pathlib.Path('/tmp/PitchBlackEncounterAssets.zip')
          archive_path.write_bytes(archive_bytes)
          staging = pathlib.Path('/tmp/pitchblack-extract')
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)

          with zipfile.ZipFile(archive_path) as zf:
              for member in zf.infolist():
                  name = member.filename.replace('\\', '/')
                  if member.is_dir():
                      continue
                  if not (name.startswith('TheRake/') or name.startswith('AbominableSnowman/')):
                      continue
                  if '..' in pathlib.PurePosixPath(name).parts:
                      raise RuntimeError(f'unsafe archive member {name}')
                  target = staging / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(member) as src, target.open('wb') as dst:
                      shutil.copyfileobj(src, dst)

          expected = {
              'TheRake/TheRake.fbx': '72b266ef613d576d0fa801c7bff200b4ef30055cbfa985b1cb6170e1fa6358ed',
              'AbominableSnowman/AbominableSnowman.glb': '21a54b05ab933cafd497411f6a6588393cd85d061cf6b21835772ee9b9fb6839',
          }
          for rel, sha in expected.items():
              p = staging / rel
              if not p.exists():
                  raise RuntimeError(f'missing extracted asset {rel}')
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != sha:
                  raise RuntimeError(f'{rel}: SHA mismatch {actual}')

          destination = pathlib.Path('Assets/Resources/ThirdParty')
          destination.mkdir(parents=True, exist_ok=True)
          for family in ('TheRake', 'AbominableSnowman'):
              target = destination / family
              if target.exists():
                  shutil.rmtree(target)
              shutil.copytree(staging / family, target)

          print(f'Authorized archive verified: {actual_archive_sha}')

      - name: Commit native Unity assets and remove transport workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "UNITYLAPTOP Asset Ingest"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/vendor-pitch-black-creatures.yml
          git add -f Assets/Resources/ThirdParty/TheRake Assets/Resources/ThirdParty/AbominableSnowman
          git status --short
          git commit -m "Vendor authorized Rake and Abominable Snowman assets"
          git push origin HEAD:feature/vendor-pitch-black-creatures
