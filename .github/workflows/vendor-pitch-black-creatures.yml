name: Ingest pitch-black creature assets

on:
  push:
    branches:
      - feature/vendor-pitch-black-creatures
    paths:
      - .github/workflows/vendor-pitch-black-creatures.yml

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
