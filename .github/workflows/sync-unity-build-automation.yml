name: Sync Unity Build Automation mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unitylaptop-uba-mirror
  cancel-in-progress: true

jobs:
  sync:
    name: Publish material build-request change to Unity Build Automation branch
    if: github.repository == 'karlokalinic/my-unity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Publish real trigger-file change on UBA branch
        shell: bash
        run: |
          set -euo pipefail

          canonical_sha="$(git rev-parse HEAD)"
          requested_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          printf '{"canonicalMain":"%s","requestedAtUtc":"%s","githubRunId":"%s"}\n' \
            "${canonical_sha}" "${requested_at}" "${GITHUB_RUN_ID}" > .uba-build-request.json

          git config user.name "UNITYLAPTOP Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .uba-build-request.json
          git commit \
            -m "chore(uba): materially request WebGL build for ${canonical_sha}" \
            -m "Canonical-Main: ${canonical_sha}"

          mirror_sha="$(git rev-parse HEAD)"
          changed="$(git diff --name-only "${canonical_sha}" HEAD)"
          test "${changed}" = ".uba-build-request.json"

          git push origin HEAD:refs/heads/tooling/unity-cloud-devops --force

          remote_sha="$(git ls-remote origin refs/heads/tooling/unity-cloud-devops | awk 'NR == 1 { print $1}')"
          test -n "${remote_sha}"
          test "${remote_sha}" = "${mirror_sha}"

          echo "UBA_BUILD_REQUESTED canonical_revision=${canonical_sha} mirror_revision=${mirror_sha} material_change=.uba-build-request.json branch=tooling/unity-cloud-devops"
