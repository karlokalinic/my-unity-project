name: Sync Unity Build Automation mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unitylaptop-uba-mirror
  cancel-in-progress: true

jobs:
  sync:
    name: Mirror canonical main to Unity Build Automation branch
    if: github.repository == 'karlokalinic/my-unity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Force mirror to exact canonical revision
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/tooling/unity-cloud-devops --force

          remote_sha="$(git ls-remote origin refs/heads/tooling/unity-cloud-devops | awk 'NR == 1 { print $1 }')"
          test -n "${remote_sha}"
          test "${remote_sha}" = "${GITHUB_SHA}"
          echo "UBA_MIRROR_SYNCED revision=${remote_sha} branch=tooling/unity-cloud-devops"
