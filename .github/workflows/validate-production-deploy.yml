name: Validate production deployment

on:
  push:
    branches:
      - main
      - infra/uba-cloudflare-production
    paths:
      - 'cloudflare/**'
      - 'scripts/uba-postbuild-cloudflare.sh'
      - 'Assets/Editor/CloudflareWebGLPostBuild.cs'
      - 'package.json'
      - 'ONLINE_CHATOPS.md'
      - '.github/workflows/sync-unity-build-automation.yml'
      - '.github/workflows/validate-production-deploy.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'scripts/uba-postbuild-cloudflare.sh'
      - 'Assets/Editor/CloudflareWebGLPostBuild.cs'
      - 'package.json'
      - 'ONLINE_CHATOPS.md'
      - '.github/workflows/sync-unity-build-automation.yml'
      - '.github/workflows/validate-production-deploy.yml'

permissions:
  contents: read

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate production ownership and revision proof contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/uba-postbuild-cloudflare.sh
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path('.')
          wrangler = (root / 'cloudflare/wrangler.uba.toml').read_text(encoding='utf-8')
          shell = (root / 'scripts/uba-postbuild-cloudflare.sh').read_text(encoding='utf-8')
          hook = (root / 'Assets/Editor/CloudflareWebGLPostBuild.cs').read_text(encoding='utf-8')
          sync = (root / '.github/workflows/sync-unity-build-automation.yml').read_text(encoding='utf-8')
          docs = (root / 'ONLINE_CHATOPS.md').read_text(encoding='utf-8')

          if not re.search(r'^name\s*=\s*"unitylaptop"\s*$', wrangler, re.MULTILINE):
              raise SystemExit('Production Wrangler config must own Worker unitylaptop.')
          if '../.uba-cloudflare-webgl' not in wrangler:
              raise SystemExit('Production Wrangler config must deploy only staged UBA output.')

          required_shell = (
              'karlokalinic/my-unity-project',
              'unitylaptop-build.json',
              'sourceRevision',
              'buildRevision',
              'createUnityInstance',
              'app.js?v=20260905-physics1',
              '26214400',
              'CLOUDFLARE_DEPLOY_OK',
              'BUILD_REVISION',
              'UCB_BUILD_NUMBER',
              'tooling/unity-cloud-devops',
              'git ls-remote',
              'FETCH_HEAD^{tree}',
              'BUILD_TREE',
              'CANONICAL_TREE',
          )
          for token in required_shell:
              if token not in shell:
                  raise SystemExit(f'Production deploy script missing contract token: {token}')

          required_hook = (
              'IPostprocessBuildWithReport',
              'BuildTarget.WebGL',
              'IS_BUILDER',
              'SCM_BRANCH',
              'tooling/unity-cloud-devops',
              'CLOUDFLARE_API_TOKEN',
              'CLOUDFLARE_ACCOUNT_ID',
              'Debug.LogWarning',
              'build-only result',
              'uba-postbuild-cloudflare.sh',
              'BuildFailedException',
          )
          for token in required_hook:
              if token not in hook:
                  raise SystemExit(f'Unity production post-build hook missing contract token: {token}')

          required_sync = (
              'branches: [main]',
              'contents: write',
              'git commit --allow-empty',
              'Canonical-Main:',
              'HEAD:refs/heads/tooling/unity-cloud-devops --force',
              'UBA_BUILD_REQUESTED',
          )
          for token in required_sync:
              if token not in sync:
                  raise SystemExit(f'UBA mirror workflow missing contract token: {token}')

          required_docs = (
              'UNITYLAPTOP-WebGL-DEV',
              'tooling/unity-cloud-devops',
              'c5f8ee3c-ba65-4e4a-8174-2fc09f6e9b52',
              '6872486406979',
              'build-request commit',
          )
          for token in required_docs:
              if token not in docs:
                  raise SystemExit(f'Production runbook missing actual UBA configuration token: {token}')

          print('Production Unity->UBA build-request mirror->Cloudflare ownership/revision contract passed.')
          PY

      - name: Wrangler dry-run against synthetic Unity staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .uba-cloudflare-webgl/Build
          cat > .uba-cloudflare-webgl/index.html <<'HTML'
          <!doctype html><html><body><script src="Build/test.loader.js"></script><script>createUnityInstance(document.body,{})</script></body></html>
          HTML
          printf 'console.log("loader");\n' > .uba-cloudflare-webgl/Build/test.loader.js
          npm install --no-package-lock --no-audit --no-fund
          npm run check:cloudflare
