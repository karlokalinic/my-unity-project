name: Build ZRAKOPERKA Android v16

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-v16-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-v16-
            Library-Android-
            Library-

      - name: Build ZRAKOPERKA v16 APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.4.0f1
          targetPlatform: Android
          buildMethod: KarloLegend.AndroidV16Build.Build
          allowDirtyBuild: true
          androidExportType: androidPackage
          versioning: None

      - name: Verify APK
        shell: bash
        run: |
          test -f build/Android/ZRAKOPERKA-v16.apk
          ls -lh build/Android/ZRAKOPERKA-v16.apk
          sha256sum build/Android/ZRAKOPERKA-v16.apk | tee build/Android/ZRAKOPERKA-v16.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZRAKOPERKA-v16-APK
          path: |
            build/Android/ZRAKOPERKA-v16.apk
            build/Android/ZRAKOPERKA-v16.sha256
          if-no-files-found: error
          retention-days: 30
