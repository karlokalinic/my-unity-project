name: Build ZRAKOPERKA v16 installable APK shell

on:
  push:
    branches:
      - build/android-v16
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/android-v16-web-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p dist
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk dist/ZRAKOPERKA-v16.apk
          sha256sum dist/ZRAKOPERKA-v16.apk | tee dist/ZRAKOPERKA-v16.sha256
          ls -lh dist/ZRAKOPERKA-v16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZRAKOPERKA-v16-APK-installable
          path: |
            dist/ZRAKOPERKA-v16.apk
            dist/ZRAKOPERKA-v16.sha256
          if-no-files-found: error
          retention-days: 30
