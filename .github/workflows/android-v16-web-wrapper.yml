name: Build ZRAKOPERKA v16 OFFLINE APK

on:
  push:
    branches:
      - build/android-v16
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/android-v16-web-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build fully offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned last-good Unity WebGL build
        run: python3 android-wrapper/fetch_offline_webgl.py

      - name: Prove package has Unity payload
        shell: bash
        run: |
          test -f android-wrapper/app/src/main/assets/www/index.html
          test -f android-wrapper/app/src/main/assets/www/offline-manifest.json
          find android-wrapper/app/src/main/assets/www -type f -maxdepth 4 -printf '%p %s bytes\n'
          du -sh android-wrapper/app/src/main/assets/www

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build offline debug APK
        working-directory: android-wrapper
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage and inspect APK
        shell: bash
        run: |
          mkdir -p dist
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk dist/ZRAKOPERKA-v16-OFFLINE.apk
          unzip -l dist/ZRAKOPERKA-v16-OFFLINE.apk | grep 'assets/www/index.html'
          unzip -l dist/ZRAKOPERKA-v16-OFFLINE.apk | grep 'assets/www/offline-manifest.json'
          unzip -l dist/ZRAKOPERKA-v16-OFFLINE.apk | grep -E 'assets/www/.*\.(wasm|unityweb|data)' | head
          sha256sum dist/ZRAKOPERKA-v16-OFFLINE.apk | tee dist/ZRAKOPERKA-v16-OFFLINE.sha256
          ls -lh dist/ZRAKOPERKA-v16-OFFLINE.apk

      - name: Upload offline APK
        uses: actions/upload-artifact@v4
        with:
          name: ZRAKOPERKA-v16-OFFLINE-APK
          path: |
            dist/ZRAKOPERKA-v16-OFFLINE.apk
            dist/ZRAKOPERKA-v16-OFFLINE.sha256
          if-no-files-found: error
          retention-days: 30
