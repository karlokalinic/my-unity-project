name: Production Unity WebGL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unitylaptop-production-webgl
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy production WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PUBLIC_URL: https://unitylaptop.karlolegend.workers.dev
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate production credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${UNITY_LICENSE:-}" ]] && { [[ -z "${UNITY_EMAIL:-}" ]] || [[ -z "${UNITY_PASSWORD:-}" ]]; }; then
            echo '::error::Unity activation is unavailable. Configure UNITY_LICENSE, or UNITY_EMAIL + UNITY_PASSWORD (and UNITY_SERIAL for a serial license).'
            exit 1
          fi
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo '::error::Missing CLOUDFLARE_API_TOKEN.'; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID.'; exit 1; }
          echo 'Production credential boundary is configured.'

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-6000.4.0f1-WebGL-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-6000.4.0f1-WebGL-
            Library-${{ runner.os }}-

      - name: Build Unity 6000.4.0f1 WebGL
        id: unity-build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.4.0f1
          targetPlatform: WebGL
          buildsPath: build
          buildName: WebGL
          versioning: None

      - name: Stage and verify generated Unity player
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t indexes < <(find build -type f -name index.html -print)
          if [[ ${#indexes[@]} -ne 1 ]]; then
            printf '::error::Expected exactly one Unity index.html under build; found %s\n' "${#indexes[@]}"
            printf '%s\n' "${indexes[@]:-}"
            exit 1
          fi
          output_dir="$(dirname "${indexes[0]}")"
          rm -rf .uba-cloudflare-webgl
          mkdir -p .uba-cloudflare-webgl
          cp -a "${output_dir}/." .uba-cloudflare-webgl/

          index=.uba-cloudflare-webgl/index.html
          if grep -Fq 'app.js?v=20260905-physics1' "$index" || grep -Fq '<div class="brand">UNITYLAPTOP <span>WEBGL</span></div>' "$index"; then
            echo '::error::Generated artifact matches the legacy browser fallback. Refusing production deploy.'
            exit 1
          fi
          if ! grep -Eq 'createUnityInstance|\.loader\.js' "$index"; then
            echo '::error::Generated index.html does not contain a Unity WebGL loader fingerprint.'
            exit 1
          fi

          python3 - <<'PY'
          import json, os, pathlib
          payload = {
              "sourceRepository": "karlokalinic/my-unity-project",
              "sourceRevision": os.environ["GITHUB_SHA"],
              "buildNumber": os.environ["GITHUB_RUN_NUMBER"],
              "buildRunId": os.environ["GITHUB_RUN_ID"],
              "artifact": "Unity WebGL",
              "builder": "GitHub Actions / game-ci",
          }
          pathlib.Path('.uba-cloudflare-webgl/unitylaptop-build.json').write_text(
              json.dumps(payload, separators=(',', ':')), encoding='utf-8')
          PY

          oversized="$(find .uba-cloudflare-webgl -type f -size +26214400c -print -quit)"
          if [[ -n "$oversized" ]]; then
            size="$(wc -c < "$oversized" | tr -d ' ')"
            echo "::error::Cloudflare static asset exceeds 25 MiB: $oversized ($size bytes)."
            exit 1
          fi

          echo "Unity player staged from ${output_dir}:"
          find .uba-cloudflare-webgl -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload exact WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: UNITYLAPTOP-WebGL-${{ github.sha }}
          path: .uba-cloudflare-webgl
          if-no-files-found: error
          retention-days: 7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cloudflare deployment tooling
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Deploy exact Unity player to production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config cloudflare/wrangler.uba.toml

      - name: Verify exact public production revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            marker="$(curl --fail --silent --show-error --location --max-time 20 "${PUBLIC_URL}/unitylaptop-build.json" 2>/dev/null || true)"
            index="$(curl --fail --silent --show-error --location --max-time 20 "${PUBLIC_URL}/" 2>/dev/null || true)"
            if [[ "$marker" == *'"sourceRepository":"karlokalinic/my-unity-project"'* ]] && \
               [[ "$marker" == *"\"sourceRevision\":\"${GITHUB_SHA}\""* ]] && \
               [[ "$index" != *'app.js?v=20260905-physics1'* ]] && \
               { [[ "$index" == *'createUnityInstance'* ]] || [[ "$index" == *'.loader.js'* ]]; }; then
              echo "PUBLIC_WEBGL_VERIFIED revision=${GITHUB_SHA} url=${PUBLIC_URL}"
              exit 0
            fi
            echo "Public revision not ready (${attempt}/24); waiting 5s..."
            sleep 5
          done
          echo "::error::Production Worker did not serve exact Unity revision ${GITHUB_SHA}."
          exit 1
